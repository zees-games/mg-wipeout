# Tag it and the artifact lands on the release. What gets built is decided by shape:
# an addon repository ships addons/<name>/ as a zip that installs by being unpacked at
# a project root, everything else ships the tracked tree as a tarball. Both come with
# a SHA256SUMS, and a game adds its pack zip. See gamespice-platform/ci.
#
# The release may already exist by the time this runs -- the tag is what the sync
# reacts to -- so this uploads into one that is there rather than failing on it.
#
# It publishes nothing to the content origin and signs nothing. A mounted resource
# pack can contain scripts and can never be unmounted, so the private signing key
# lives in one deployment and not in sixty release workflows.
name: Release

on:
    push:
        tags: ['v*']

jobs:
    validate:
        uses: gamespice-platform/ci/.github/workflows/validate.yml@1f427d257382fc5e1944ceaf54c3074cc13f7731  # v1.4.2 plus the source-lock restore (validate/resolve-deps/package); back to @v1 once the tag moves
        with:
            suite-timeout: 900
        secrets:
            DEPS_TOKEN: ${{ secrets.GS_DEPS_TOKEN }}

    # pack: true also attaches <repo>-<version>-pack.zip, the imported tree website-city
    # publishes as this game's signed pack; the source tarball alone cannot be one.
    # @v1.2.2 (images/ left out of the pack, as well as v1.2.1's requires.json and draft-until-complete) until v1 is moved onto it.
    release:
        needs: validate
        uses: gamespice-platform/ci/.github/workflows/release.yml@1f427d257382fc5e1944ceaf54c3074cc13f7731  # v1.4.2 plus the source-lock restore (validate/resolve-deps/package); back to @v1 once the tag moves
        permissions:
            contents: write
        with:
            pack: true
            pack-deny: 'tmcdev(?:games)?\.net|x-tmc-dev'
        secrets:
            DEPS_TOKEN: ${{ secrets.GS_DEPS_TOKEN }}
