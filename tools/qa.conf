# What the shared QA scripts in dot-game/tools need to know about this game (sourced by perf_budget.sh, visual_check.sh).
# One perf case: the client bench has no map switch, so "wo_spin_cycle" is the real client against the real server and module on that course.
PERF_CASES=wo_spin_cycle
PERF_SECONDS=20

perf_run_case() {
    GPU_TIMEOUT=300 timeout -k 10 360 ../gpu.sh run "$GAME" res://tools/client_bench.tscn -- \
        --delay 20 --play --seconds "$2" --json
}

# A case is a course id; the shots are tools/shot.sh views.
VISUAL_CASES="wo_spin_cycle"
VISUAL_SHOTS="start course"

visual_render() {
    heavy -- timeout 300 tools/shot.sh --view=start --wo-course-ids="$1" --out="res://screenshots/${1}_start.png" || return 1
    heavy -- timeout 300 tools/shot.sh --view=course --wo-course-ids="$1" --out="res://screenshots/${1}_course.png"
}
